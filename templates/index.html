<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plant Monitor v9.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.0/dist/chartjs-plugin-annotation.min.js"></script>

    <style>
        :root { 
            --bg: #000000; 
            --card-bg: rgba(30, 30, 35, 0.4);
            --text: #ffffff; 
            --sub: #9ca3af;
            
            /* 狀態色票 */
            --c-blue:   #38bdf8; 
            --c-green:  #4ade80; 
            --c-yellow: #facc15; 
            --c-red:    #f87171; 
            
            /* 圖表主題色 */
            --c-chart-line: #4ade80; 
        }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: radial-gradient(circle at 50% 0%, #1a1a20 0%, #000000 100%); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh; 
            -webkit-font-smoothing: antialiased;
        }
        
        .container { max-width: 500px; margin: 0 auto; padding-bottom: 40px; }

        /* --- 主卡片設計 --- */
        .card { 
            border-radius: 26px; 
            /* ★ 黃金比例內距：28px (比上次大，比上上次小) ★ */
            padding: 28px 30px; 
            position: relative; 
            margin-bottom: 20px; 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            /* 強效毛玻璃 */
            backdrop-filter: blur(20px) saturate(180%); 
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); 
        }

        /* 狀態光暈 */
        .card.level-FREEZE, .card.level-COLD { border-color: var(--c-blue); box-shadow: 0 0 35px rgba(56, 189, 248, 0.15); }
        .card.level-BEST, .card.level-GOOD { border-color: var(--c-green); box-shadow: 0 0 35px rgba(74, 222, 128, 0.15); }
        .card.level-WARN { border-color: var(--c-yellow); box-shadow: 0 0 35px rgba(250, 204, 21, 0.15); animation: breathe 3s infinite; }
        .card.level-DANGER { border-color: var(--c-red); box-shadow: 0 0 45px rgba(248, 113, 113, 0.25); animation: pulse 1s infinite; }
        
        @keyframes breathe { 0%, 100% { border-color: var(--c-yellow); opacity: 1; } 50% { border-color: rgba(250, 204, 21, 0.5); opacity: 0.9; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); border-color: var(--c-red); } 50% { transform: scale(1.01); border-color: rgba(248, 113, 113, 0.6); } }

        /* --- Header --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title { font-weight: 800; font-size: 0.75rem; letter-spacing: 1.2px; text-transform: uppercase; color: var(--sub); opacity: 0.8; }
        .status-pill { 
            background: rgba(255,255,255,0.05); padding: 5px 12px; border-radius: 14px; 
            font-size: 0.7rem; font-weight: 600; display: flex; align-items: center; gap: 6px; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #444; }
        .dot.online { background: var(--c-green); box-shadow: 0 0 6px var(--c-green); }
        .latency-msg { color: #666; font-weight: 400; margin-left: 2px; }

        /* --- Main Layout --- */
        .main-display { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 30px; 
            margin: 15px 0 25px 0; 
        }

        .temp-wrapper { display: flex; align-items: flex-start; }
        /* ★ 字體調整：5.6rem (適中大小) ★ */
        .temp-val { font-size: 5.6rem; font-weight: 800; line-height: 0.9; letter-spacing: -2px; color: #fff; }
        .unit { font-size: 1.6rem; font-weight: 500; color: var(--sub); margin-top: 8px; margin-left: 5px; }

        /* 右側 Max/Min */
        .extremes-col { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            padding-left: 25px;
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        .ex-item { display: flex; flex-direction: column; align-items: flex-start; }
        .ex-label { font-size: 0.65rem; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .ex-val { font-size: 1.2rem; font-weight: 700; }
        .val-max { color: var(--c-red); }
        .val-min { color: var(--c-blue); }
        /* 新增：給 JS 控制 Swing 顏色用的 class */
        .val-warn { color: var(--c-yellow); }
        .val-safe { color: var(--c-green); }

        .guard-msg { text-align: center; font-size: 0.9rem; color: var(--sub); margin-bottom: 25px; font-weight: 500; letter-spacing: 0.3px; min-height: 1.2em;}

        /* --- Bottom Stats (Grid) --- */
        .info-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }
        .info-item { display: flex; flex-direction: column; align-items: center; }
        .info-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--sub); margin-bottom: 4px; }
        .info-value { font-size: 1.1rem; font-weight: 600; color: #fff; }

        /* --- Chart Section --- */
        .chart-card { 
            background: var(--card-bg); border-radius: 26px; padding: 20px; 
            border: 1px solid rgba(255,255,255,0.05); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }
        
        .time-controls { 
            display: flex; justify-content: space-between; background: rgba(0, 0, 0, 0.4); 
            padding: 4px; border-radius: 12px; margin-bottom: 15px; 
        }
        .time-btn { 
            flex: 1; border: none; background: transparent; padding: 7px 0; 
            font-size: 0.75rem; font-weight: 600; color: #666; cursor: pointer; 
            border-radius: 8px; transition: 0.2s; 
        }
        .time-btn.active { background: rgba(255, 255, 255, 0.15); color: #fff; }
        
        .chart-container { position: relative; height: 260px; width: 100%; }
        .footer-info { text-align: center; margin-top: 15px; font-size: 0.7rem; color: #444; }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="card level-NORMAL" id="mainCard">
            <div class="header">
                <div class="title">Monitor v9.5</div>
                <div class="status-pill">
                    <div id="dot" class="dot"></div>
                    <span id="conn">Wait...</span>
                    <span id="latency" class="latency-msg"></span>
                </div>
            </div>

            <div class="main-display">
                <div class="temp-wrapper">
                    <span id="temp" class="temp-val">--</span>
                    <span class="unit">°C</span>
                </div>
                
                <div class="extremes-col">
                    <div class="ex-item">
                        <span class="ex-label">Max 24h</span>
                        <span id="max24" class="ex-val val-max">--</span>
                    </div>
                    <div class="ex-item">
                        <span class="ex-label">Min 24h</span>
                        <span id="min24" class="ex-val val-min">--</span>
                    </div>
                </div>
            </div>

            <div id="guardMsg" class="guard-msg">System Initializing...</div>

            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Humidity</span>
                    <span class="info-value"><span id="humi">--</span>%</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Daily Swing</span>
                    <span class="info-value" id="swing24">--</span>
                </div>
            </div>
        </div>

        <div class="chart-card">
            <div class="time-controls">
                <button onclick="changeRange('1h', this)" class="time-btn active">1H</button>
                <button onclick="changeRange('6h', this)" class="time-btn">6H</button>
                <button onclick="changeRange('12h', this)" class="time-btn">12H</button>
                <button onclick="changeRange('24h', this)" class="time-btn">24H</button>
                <button onclick="changeRange('7d', this)" class="time-btn">7D</button>
            </div>
            <div class="chart-container">
                <canvas id="chart"></canvas>
            </div>
            <div class="footer-info">Uptime: <span id="uptime">0m</span></div>
        </div>

    </div>

    <script>
        let chart; let currentRange = '1h'; let lastTs = 0;
        window.onload = function() { initChart(); loop(); setInterval(updateLatency, 1000); };
        
        function updateLatency() {
            if(lastTs === 0) return;
            const sec = Math.floor((Date.now()/1000) - lastTs);
            const el = document.getElementById('latency');
            el.innerText = sec + "s";
            if(sec > 10) el.style.color = '#f87171'; else el.style.color = '#666';
        }

        function initChart() {
            const ctx = document.getElementById('chart').getContext('2d');
            
            let gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(74, 222, 128, 0.2)'); 
            gradient.addColorStop(1, 'rgba(74, 222, 128, 0.0)');

            const annotations = {
                dangerLine: {
                    type: 'line', yMin: 28, yMax: 28, borderColor: '#f87171', borderWidth: 1, borderDash: [4, 4], adjustScaleRange: false,
                    label: { display: true, content: '28°C', position: 'end', color: '#f87171', font: { size: 9 }, backgroundColor: 'transparent', yAdjust: -10 }
                },
                warnLine: {
                    type: 'line', yMin: 25, yMax: 25, borderColor: '#facc15', borderWidth: 1, borderDash: [4, 4], adjustScaleRange: false,
                    label: { display: true, content: '25°C', position: 'end', color: '#facc15', font: { size: 9 }, backgroundColor: 'transparent', yAdjust: -10 }
                },
                coldLine: {
                    type: 'line', yMin: 20, yMax: 20, borderColor: '#38bdf8', borderWidth: 1, borderDash: [4, 4], adjustScaleRange: false,
                    label: { display: true, content: '20°C', position: 'end', color: '#38bdf8', font: { size: 9 }, backgroundColor: 'transparent', yAdjust: -10 }
                }
            };

            chart = new Chart(ctx, { 
                type: 'line', 
                data: { labels: [], datasets: [{ 
                    label: 'Temp', 
                    data: [], 
                    borderColor: '#4ade80', 
                    borderWidth: 2.5, 
                    tension: 0.4, 
                    pointRadius: 0, 
                    backgroundColor: gradient,
                    fill: true 
                }] }, 
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { 
                        legend: { display: false },
                        annotation: { clip: false, annotations: annotations }
                    }, 
                    animation: false, 
                    scales: { 
                        x: { 
                            display: true, 
                            grid: { display: false }, 
                            ticks: { color: '#666', font: { size: 10 }, maxTicksLimit: 5, maxRotation: 0 } 
                        }, 
                        y: { 
                            grace: '20%',
                            grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false }, 
                            ticks: { color: '#666', font: { size: 10 } } 
                        } 
                    } 
                } 
            });
        }

        async function loop() {
            try {
                const res = await fetch('/api/live?t=' + new Date().getTime()); const data = await res.json();
                
                document.getElementById('temp').innerText = data.temp;
                document.getElementById('humi').innerText = data.humi;
                document.getElementById('guardMsg').innerText = data.guard_msg;
                document.getElementById('max24').innerText = data.max_24h;
                document.getElementById('min24').innerText = data.min_24h;
                document.getElementById('uptime').innerText = data.uptime;
                
                if(data.ts) lastTs = data.ts;

                // ★ Daily Swing 顏色邏輯 ★
                const swingElem = document.getElementById('swing24');
                swingElem.innerText = data.swing_24h + (data.swing_24h !== '--' ? '°C' : '');
                
                // 先移除所有顏色 class
                swingElem.classList.remove('val-safe', 'val-warn', 'val-max');
                
                if(data.swing_24h !== '--') {
                    let s = parseFloat(data.swing_24h);
                    if(s > 10.0) swingElem.classList.add('val-max');       // 紅色
                    else if(s > 5.0) swingElem.classList.add('val-warn');  // 黃色
                    else swingElem.classList.add('val-safe');              // 綠色 (穩定)
                }

                const dot = document.getElementById('dot');
                if(data.status === "Online") { dot.classList.add('online'); document.getElementById('conn').innerText="Online"; } else { dot.classList.remove('online'); document.getElementById('conn').innerText=data.status; }
                
                const card = document.getElementById('mainCard');
                const lvl = data.guard_level || 'GOOD';
                card.className = `card level-${lvl}`;
                
                await updateChart(false);

            } catch(e) {}
            setTimeout(loop, 3000);
        }

        async function updateChart(forceRedraw = false) {
            try {
                const hRes = await fetch(`/api/history?range=${currentRange}&t=` + new Date().getTime()); const hData = await hRes.json();
                if(chart) { 
                    chart.data.labels = hData.labels; 
                    chart.data.datasets[0].data = hData.temp; 
                    if (forceRedraw) { chart.update(); } else { chart.update('none'); }
                }
            } catch(e) {}
        }

        function changeRange(range, btn) { 
            currentRange = range; 
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active')); 
            btn.classList.add('active'); 
            updateChart(true); 
        }
    </script>
</body>
</html>
